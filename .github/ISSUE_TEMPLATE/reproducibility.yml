name: Reproducibility issue
description: Report a problem reproducing an analysis step
title: "[Reproducibility] "
labels: []
body:
  - type: input
    id: release
    attributes:
      label: Repository release/tag
      placeholder: v1.0.0
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Script/command
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, and relevant package versions.
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Error/output
      render: shell
    validations:
      required: true
